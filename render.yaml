services:
  - type: web
    name: sap-portfolio-backend
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        value: localhost
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: admin123
      - key: DB_NAME
        value: sap_portfolio_db

databases:
  - name: sap-portfolio-db
    databaseName: sap_portfolio_db
    user: admin
    plan: free
